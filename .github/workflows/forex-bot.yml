name: Forex Signal Bot

on:
  schedule:
    # FIX 1: некруглі хвилини (3, 8, 13, 18...) — оминаємо пік GitHub :00, :05
    - cron: "3-58/5 * * * *"
  workflow_dispatch: {}

concurrency:
  group: forex-bot
  # FIX 2: cancel-in-progress=true — завислі прогони скасовуються
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    # FIX 3: якщо прогін триває >3 хв — вбиваємо (не блокує наступні)
    timeout-minutes: 3
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # FIX 4: fetch-depth=1 — швидший checkout (нам не потрібна вся історія)
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          # FIX 5: кеш pip — pandas/yfinance встановлюються з кешу (швидше на 15-20 сек)
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python forex_bot.py

      - name: Commit updated state and journals
        run: |
          git config user.name "forex-bot"
          git config user.email "forex-bot@users.noreply.github.com"
          echo "=== Файли після бота ==="
          ls -la
          [ -f last_signals.json ] && git add last_signals.json && echo "added last_signals.json" || echo "no last_signals.json"
          [ -f signals_journal.csv ] && git add signals_journal.csv && echo "added signals_journal.csv" || echo "no signals_journal.csv"
          [ -f outcomes_journal.csv ] && git add outcomes_journal.csv && echo "added outcomes_journal.csv" || echo "no outcomes_journal.csv"
          echo "=== git status ==="
          git status
          if git diff --cached --quiet; then
            echo "Нема змін для коміту"
          else
            git commit -m "update bot state [skip ci]"
            git pull --rebase origin main || true
            git push
          fi
