name: Forex Signal Bot

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

concurrency:
  group: forex-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python forex_bot.py

      - name: Commit updated state and journals
        run: |
          git config user.name "forex-bot"
          git config user.email "forex-bot@users.noreply.github.com"
          echo "=== Файли після бота ==="
          ls -la
          echo "=== CSV JSON ==="
          ls -la *.csv *.json 2>/dev/null || echo "немає csv/json"
          git add last_signals.json signals_journal.csv outcomes_journal.csv 2>/dev/null || true
          echo "=== git status ==="
          git status
          if git diff --cached --quiet; then
            echo "Нема змін для коміту"
          else
            git commit -m "update bot state [skip ci]"
            git pull --rebase origin main || true
            git push
          fi
